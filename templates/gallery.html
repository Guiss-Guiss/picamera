<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="PiCamera Photo Gallery">
    <meta name="robots" content="noindex, nofollow">
    <title>PiCamera - Photo Gallery</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 style="text-align: center;">Photo Gallery</h1>
            <div class="buttons-container">
                <a href="{{ url_for('index') }}" class="btn btn-grey">Back to Camera</a>
            </div>
        </div>

        <div class="panel">
            <div id="gallery" class="grid-gallery">
                <!-- Gallery will be populated dynamically by JavaScript -->
            </div>
        </div>
    </div>

    <div id="toast" style="display: none;" class="toast"></div>

    <script src="{{ url_for('static', filename='js/gallery.js') }}"></script>
</body>
</html>
